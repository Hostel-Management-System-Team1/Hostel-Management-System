<div class="hms-pw">

    <span class="hms-status hms-status--on">Set</span>
  {% else %}
    <span class="hms-status">Not set</span>
  {% endif %}
  <a class="button hms-button-secondary" href="{{ password_url|default:"../password/" }}"><i class="bi bi-key" aria-hidden="true"></i>{{ button_label }}</a>
</div>
