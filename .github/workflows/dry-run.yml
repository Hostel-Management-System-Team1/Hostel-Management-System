
name: Dry Run Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify README exists
        run: test -f README.md

      - name: Show successful check
        run: echo "README check passed."
